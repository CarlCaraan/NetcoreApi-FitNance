name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FitNance/FitNance.Tests/FitNance.Tests.csproj

      - name: Build
        run: dotnet build FitNance/FitNance.Tests/FitNance.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test FitNance/FitNance.Tests/FitNance.Tests.csproj --configuration Release --no-build
